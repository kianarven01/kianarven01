<svg xmlns="http://www.w3.org/2000/svg" width="760" height="112" viewBox="0 0 760 112" role="img" aria-labelledby="title desc">
  <title id="title">Konnichiwa, Kian desu (^_~)</title>
  <desc id="desc">A sakura-pink typing introduction framed by gently turning cherry blossoms and drifting petals.</desc>
  <defs>
    <path id="petal" d="M0 0C-7-10 6-16 8-7 13-13 20-1 9 4 5 6 2 4 0 0Z" fill="#f0b2cb"/>
    <g id="blossom">
      <g fill="#edabc9">
        <path id="lobe" d="M0 0C-15-7-12-22-3-18L0-21 3-18C12-22 15-7 0 0Z"/>
        <use href="#lobe" transform="rotate(72)"/>
        <use href="#lobe" transform="rotate(144)"/>
        <use href="#lobe" transform="rotate(216)"/>
        <use href="#lobe" transform="rotate(288)"/>
      </g>
      <circle r="4" fill="#f9d7b9"/>
      <g fill="#9d547c"><circle cx="-5" cy="-4" r="1.2"/><circle cx="5" cy="-4" r="1.2"/><circle cy="6" r="1.2"/></g>
    </g>
  </defs>
  <style>
    .greeting { animation: type 10s steps(30, end) infinite; }
    .fall { animation: drift 9s linear infinite; }
    .slow { animation-duration: 12s; }
    .turn { animation: turn 12s ease-in-out infinite alternate; }
    .reverse { animation-direction: alternate-reverse; }
    @keyframes drift {
      0% { transform: translate(-12px, -24px) rotate(-25deg); }
      45% { transform: translate(15px, 49px) rotate(70deg); }
      100% { transform: translate(-5px, 142px) rotate(180deg); }
    }
    @keyframes turn {
      from { transform: rotate(-12deg) scale(.82); }
      to { transform: rotate(18deg) scale(.9); }
    }
    @keyframes type {
      0%, 5% { clip-path: inset(0 100% 0 0); }
      32%, 90% { clip-path: inset(0 0 0 0); }
      100% { clip-path: inset(0 100% 0 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .greeting { animation: none; clip-path: none; }
      .fall { animation: none; transform: translate(0, 23px); }
      .turn { animation: none; transform: scale(.85); }
    }
  </style>
  <g aria-hidden="true">
    <g transform="translate(60 59)"><g class="turn"><use href="#blossom"/></g></g>
    <g transform="translate(700 59)"><g class="turn reverse"><use href="#blossom"/></g></g>
    <g transform="translate(18 0) scale(.48)"><g class="fall" style="animation-delay:-3s"><use href="#petal"/></g></g>
    <g transform="translate(100 0) scale(.55)"><g class="fall slow" style="animation-delay:-8s"><use href="#petal"/></g></g>
    <g transform="translate(44 0) scale(.65)"><g class="fall" style="animation-delay:-6s"><use href="#petal"/></g></g>
    <g transform="translate(132 0)"><g class="fall slow" style="animation-delay:-2s"><use href="#petal" transform="scale(.45)"/></g></g>
    <g transform="translate(654 0)"><g class="fall" style="animation-delay:-5s"><use href="#petal" transform="scale(.5)"/></g></g>
    <g transform="translate(725 0)"><g class="fall slow" style="animation-delay:-9s"><use href="#petal" transform="scale(.6)"/></g></g>
    <g transform="translate(682 0)"><g class="fall" style="animation-delay:-1s"><use href="#petal" transform="scale(.45)"/></g></g>
    <g transform="translate(750 0)"><g class="fall slow" style="animation-delay:-4s"><use href="#petal" transform="scale(.4)"/></g></g>
  </g>
  <g class="greeting">
    <text x="380" y="66" text-anchor="middle" fill="#f0b2cb" font-family="Verdana, sans-serif" font-size="30" font-weight="600">Konnichiwa, Kian desu (^_~)</text>
  </g>
</svg>
